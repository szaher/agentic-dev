[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-dev"
version = "0.14.0a2"
description = "Make repositories agent-ready and prepare safe, reproducible development environments for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Saad Zaher" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/szaher/agentic-dev"
Repository = "https://github.com/szaher/agentic-dev"
Issues = "https://github.com/szaher/agentic-dev/issues"
Documentation = "https://github.com/szaher/agentic-dev#readme"

[project.optional-dependencies]
test = ["jsonschema>=4.23"]

[project.scripts]
agentic = "agentic_dev.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentic_dev = ["builtin_skills/**/*.md", "builtin_skills/**/*.toml", "readiness/specs/*.json"]


[tool.setuptools.data-files]
"share/agentic-dev/scripts" = [
  "scripts/agentic-setup.sh",
  "scripts/agentic-setup-linux.sh",
  "scripts/agentic-repo-init.sh",
]
"share/agentic-dev/templates" = [
  "templates/global-agent-policy.md",
]
