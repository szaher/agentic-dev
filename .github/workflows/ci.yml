name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install 'jsonschema>=4.23'
      - name: Syntax, unit, and smoke checks
        run: make check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install packaging tools
        run: python -m pip install build twine uv 'jsonschema>=4.23'
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Smoke test installed wheel
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m venv /tmp/agentic-wheel
          /tmp/agentic-wheel/bin/python -m pip install --upgrade pip
          /tmp/agentic-wheel/bin/python -m pip install "$(ls dist/*.whl)"
          cd /tmp
          /tmp/agentic-wheel/bin/agentic --version | grep -Fx '0.16.0'
          /tmp/agentic-wheel/bin/agentic doctor --json >/dev/null
          /tmp/agentic-wheel/bin/agentic skills list >/dev/null
          /tmp/agentic-wheel/bin/python - <<'PY'
          from agentic_dev.cli import _helper_script
          for name in ("agentic-setup.sh", "agentic-setup-linux.sh", "agentic-repo-init.sh"):
              path = _helper_script(name)
              assert path is not None and path.is_file(), name
          PY
          setup_script="$(
            /tmp/agentic-wheel/bin/python - <<'PY'
          from agentic_dev.cli import _helper_script
          print(_helper_script("agentic-setup.sh"))
          PY
          )"
          repo_script="$(
            /tmp/agentic-wheel/bin/python - <<'PY'
          from agentic_dev.cli import _helper_script
          print(_helper_script("agentic-repo-init.sh"))
          PY
          )"
          bash "$setup_script" --help >/dev/null
          bash "$repo_script" --help >/dev/null

          tmprepo="$(mktemp -d)"
          git init -q "$tmprepo"
          printf '# fixture\n' > "$tmprepo/README.md"
          /tmp/agentic-wheel/bin/agentic repo init "$tmprepo"             --check             --no-codegraph             --no-serena             --no-instructions             --no-install-language-deps             --no-runtime-install             --no-skills >/dev/null

      - name: Agent Ready assessment from installed wheel
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/ci-readiness-smoke.sh /tmp/agentic-wheel/bin/agentic

      - name: Contracts from uv tool-installed wheel
        shell: bash
        run: |
          set -Eeuo pipefail
          export UV_TOOL_DIR=/tmp/agentic-uv-tools UV_TOOL_BIN_DIR=/tmp/agentic-uv-bin
          uv tool install "$(ls dist/*.whl)"
          /tmp/agentic-uv-bin/agentic --version | grep -Fx '0.16.0'
          bash scripts/ci-contracts-smoke.sh /tmp/agentic-uv-bin/agentic

      - name: Smoke test installed source distribution
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m venv /tmp/agentic-sdist
          /tmp/agentic-sdist/bin/python -m pip install --upgrade pip
          /tmp/agentic-sdist/bin/python -m pip install "$(ls dist/*.tar.gz)"
          cd /tmp
          /tmp/agentic-sdist/bin/agentic --version | grep -Fx '0.16.0'
          /tmp/agentic-sdist/bin/python - <<'PY'
          from agentic_dev.cli import _helper_script
          from agentic_dev.skills import load_registry
          assert _helper_script("agentic-setup.sh") is not None
          assert _helper_script("agentic-repo-init.sh") is not None
          assert load_registry()
          PY

      - name: Agent Ready assessment from installed sdist
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/ci-readiness-smoke.sh /tmp/agentic-sdist/bin/agentic

      - name: Contracts from installed sdist
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/ci-contracts-smoke.sh /tmp/agentic-sdist/bin/agentic
